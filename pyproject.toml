[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bibtex-dedup"
version = "0.1.0"
description = "Find and merge duplicate BibTeX entries by DOI, normalized title and fuzzy matching."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JANIN A APURBA", email = "japurba97@gmail.com"}]
keywords = ["research", "automation", "reproducibility", "academic"]
dependencies = []

[project.scripts]
bibtex-dedup = "bibtex_dedup.cli:main"

[tool.setuptools]
packages = ["bibtex_dedup"]
